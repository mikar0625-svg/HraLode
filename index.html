<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plovoucí Pevnost: Útok Zombíků</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .panel {
            position: absolute;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            box-sizing: border-box;
        }
        #velitelsky-panel {
            top: 15px;
            left: 15px;
            right: 15px;
            max-width: 420px;
            margin: 0 auto;
        }
        #prani-panel {
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-width: 420px;
            margin: 0 auto;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: transform 0.1s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .prani-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Kapitánský můstek -->
    <div id="velitelsky-panel" class="panel">
        <h2>⚓ KAPITÁNSKÝ MŮSTEK <span>(PLOVOUCÍ PEVNOST)</span></h2>
        <div class="stat-row">
            <span>Velitel:</span>
            <strong style="color: #38bdf8;">Ty (Hlavní velitel)</strong>
        </div>
        <div class="stat-row">
            <span>Stav prostředí:</span>
            <strong style="color: #cbd5e1;">Arktický mráz (-25 °C)</strong>
        </div>
        <div class="stat-row">
            <span>Hrozba z moře:</span>
            <strong style="color: #f43f5e;">Útok zombíků za 14 dní! 🧟</strong>
        </div>
        <button class="btn" onclick="zavelit()">Vydat rozkaz velitele</button>
    </div>

    <!-- Panel návrhů od sledujících -->
    <div id="prani-panel" class="panel">
        <h2>💬 NÁVRHY OD SLEDUJÍCÍCH</h2>
        <div id="seznam-prani">
            <div class="prani-box" id="prani-1">
              <span>@SeaExplorer: Vyhřívaný střešní bazén</span>
              <button class="btn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 0.75rem;" onclick="schvalit(1)">Schválit ✅</button>
            </div>
            <div class="prani-box" id="prani-2">
              <span>@CaptainFan: Přidat těžká děla na příď</span>
              <button class="btn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 0.75rem;" onclick="schvalit(2)">Schválit ✅</button>
            </div>
        </div>
    </div>

    <script>
        function zavelit() {
            alert("Rozkaz vydán! Posádka připravuje loď.");
        }
        function schvalit(id) {
            let box = document.getElementById('prani-' + id);
            box.style.background = 'rgba(16, 185, 129, 0.2)';
            box.style.borderColor = 'rgba(16, 185, 129, 0.5)';
            let btn = box.querySelector('button');
            btn.innerText = 'Schváleno! 🏗️';
            btn.style.background = '#10b981';
            btn.disabled = true;
        }

        // --- THREE.JS SCÉNA A RENDEROVÁNÍ ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a192f);
        scene.fog = new THREE.FogExp2(0x0a192f, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(22, 16, 26);
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- OSVĚTLENÍ ---
        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Teplá světla z oken lodi
        const hotelLight = new THREE.PointLight(0xffb703, 2, 25);
        hotelLight.position.set(0, 6, 0);
        scene.add(hotelLight);

        // --- ANIMOVANÁ MOŘSKÁ HLADINA ---
        const oceanGeo = new THREE.PlaneGeometry(200, 200, 64, 64);
        const oceanMat = new THREE.MeshStandardMaterial({
            color: 0x0284c7,
            roughness: 0.1,
            metalness: 0.8,
            transparent: true,
            opacity: 0.9
        });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = 0;
        scene.add(ocean);

        // --- KONSTRUKCE HOTELOVÉ LOĎE ---
        const lodSkupina = new THREE.Group();

        // 1. Ocelový trup lodi
        const trupMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
        const trup = new THREE.Mesh(new THREE.BoxGeometry(10, 3.5, 26), trupMat);
        trup.position.y = 1.75;
        trup.castShadow = true;
        trup.receiveShadow = true;
        lodSkupina.add(trup);

        // Ostrá špička přídě
        const spickaGeo = new THREE.ConeGeometry(5, 6, 4);
        const spicka = new THREE.Mesh(spickaGeo, trupMat);
        spicka.rotation.y = Math.PI / 4;
        spicka.rotation.x = Math.PI / 2;
        spicka.position.set(0, 1.75, 16);
        lodSkupina.add(spicka);

        // Oranžový bezpečnostní pruh na trupu
        const pruhMat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
        const pruh = new THREE.Mesh(new THREE.BoxGeometry(10.2, 0.4, 26.2), pruhMat);
        pruh.position.y = 3;
        lodSkupina.add(pruh);

        // 2. Kaskádová patra hotelu (Skleněná okna a balkóny)
        const oknoMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.9 });
        const stenaMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc });

        // Patro 1
        const patro1 = new THREE.Mesh(new THREE.BoxGeometry(8, 2.2, 18), stenaMat);
        patro1.position.set(0, 4.6, -1);
        lodSkupina.add(patro1);

        const okna1 = new THREE.Mesh(new THREE.BoxGeometry(8.2, 1.2, 16), oknoMat);
        okna1.position.set(0, 4.6, -1);
        lodSkupina.add(okna1);

        // Patro 2 (Užší)
        const patro2 = new THREE.Mesh(new THREE.BoxGeometry(6.5, 2, 13), stenaMat);
        patro2.position.set(0, 6.7, -2);
        lodSkupina.add(patro2);

        const okna2 = new THREE.Mesh(new THREE.BoxGeometry(6.7, 1, 11), oknoMat);
        okna2.position.set(0, 6.7, -2);
        lodSkupina.add(okna2);

        // 3. Vyhřívaný střešní bazén
        const bazenRamaMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
        const bazenVodaMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.1 });

        const bazenRam = new THREE.Mesh(new THREE.BoxGeometry(5, 0.6, 6), bazenRamaMat);
        bazenRam.position.set(0, 5.8, 6);
        lodSkupina.add(bazenRam);

        const bazenVoda = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.7, 5.2), bazenVodaMat);
        bazenVoda.position.set(0, 5.85, 6);
        lodSkupina.add(bazenVoda);

        // 4. Kapitánský můstek nahoře
        const mustekMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
        const mustek = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.5, 4), mustekMat);
        mustek.position.set(0, 8.45, 0);
        lodSkupina.add(mustek);

        const skloMustku = new THREE.Mesh(new THREE.BoxGeometry(4.7, 0.8, 3.8), oknoMat);
        skloMustku.position.set(0, 8.55, 0.2);
        lodSkupina.add(skloMustku);

        // Radarová věž
        const radarKmen = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.5), bazenRamaMat);
        radarKmen.position.set(0, 10, -0.5);
        lodSkupina.add(radarKmen);

        const radarTalir = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.4), stenaMat);
        radarTalir.position.set(0, 11, -0.5);
        lodSkupina.add(radarTalir);

        // Pristávací plocha pro vrtulník (Helipad) na přídi
        const helipadMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        const helipad = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.1, 16), helipadMat);
        helipad.position.set(0, 3.6, 12);
        lodSkupina.add(helipad);
