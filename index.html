<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesmírná / Ledová Loď Sledujícich</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050b14;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Panel overlay */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 25, 47, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1e4976;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 300px;
        }

        h1 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #4fc3f7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-item {
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #b0bec5;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .temp-cold {
            color: #81d4fa;
        }

        .coal-color {
            color: #ffb74d;
        }

        /* Voting Box */
        .vote-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 25, 47, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1e4976;
            backdrop-filter: blur(5px);
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .vote-box h2 {
            font-size: 1rem;
            margin-top: 0;
            color: #ffb74d;
        }

        .btn-vote {
            width: 100%;
            background: #0288d1;
            border: none;
            color: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }

        .btn-vote:hover {
            background: #039be5;
        }

        .vote-count {
            float: right;
            opacity: 0.8;
        }
    </style>
    <!-- Načtení Three.js pro 3D grafiku -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Informační panel -->
    <div class="ui-panel">
        <h1>Kapitánský Panel</h1>
        <div class="stat-item">
            <span class="stat-label">Kapitán:</span>
            <span class="stat-value" style="color: #4caf50;">VY (Ty)</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Stav zimy:</span>
            <span class="stat-value temp-cold" id="temp">-24 °C ❄️</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Zásoby Uhlí:</span>
            <span class="stat-value coal-color" id="coal">100 tun</span>
        </div>
        <p style="font-size: 0.8rem; color: #90a4ae; margin-top: 15px;">
            * Každý nový Follower na IG přidává +5 tun uhlí k přežití extrémní mrazivé zimy!
        </p>
    </div>

    <!-- Hlasování posádky -->
    <div class="vote-box">
        <h2>Hlasování posádky</h2>
        <p style="font-size: 0.85rem; color: #b0bec5;">Co máme na lodi postavit jako další?</p>
        
        <button class="btn-vote" onclick="vote(1)">
            🔥 Přidat Velký Kotel 
            <span class="vote-count" id="vote1">0</span>
        </button>
        <button class="btn-vote" onclick="vote(2)">
            🛡️ Zesílit Trup Lodi 
            <span class="vote-count" id="vote2">0</span>
        </button>
        <button class="btn-vote" onclick="vote(3)">
            ⚡ Solární Štíty 
            <span class="vote-count" id="vote3">0</span>
        </button>
    </div>

    <script>
        // --- 1. VYTVOŘENÍ 3D SCÉNY (Three.js) ---
        const container = document.getElementById('canvas-container');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);
        scene.fog = new THREE.FogExp2(0x050b14, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Osvětlení
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x81d4fa, 1);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- 2. MODEL LODĚ (Stavba ze 3D tvarů) ---
        const shipGroup = new THREE.Group();

        // Trup lodi
        const hullGeometry = new THREE.BoxGeometry(8, 4, 20);
        const hullMaterial = new THREE.MeshStandardMaterial({ color: 0x263238, roughness: 0.3 });
        const hull = new THREE.Mesh(hullGeometry, hullMaterial);
        hull.position.y = 2;
        shipGroup.add(hull);

        // Příď lodi (špička)
        const bowGeometry = new THREE.ConeGeometry(4, 8, 4);
        const bowMaterial = new THREE.MeshStandardMaterial({ color: 0x37474f });
        const bow = new THREE.Mesh(bowGeometry, bowMaterial);
        bow.rotation.x = Math.PI / 2;
        bow.rotation.z = Math.PI / 4;
        bow.position.set(0, 2, -14);
        shipGroup.add(bow);

        // Kapitánský můstek / Věž
        const cabinGeometry = new THREE.BoxGeometry(6, 6, 6);
        const cabinMaterial = new THREE.MeshStandardMaterial({ color: 0x455a64 });
        const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
        cabin.position.set(0, 7, 2);
        shipGroup.add(cabin);

        // Velký komín (na uhlí)
        const chimneyGeometry = new THREE.CylinderGeometry(1, 1, 6, 16);
        const chimneyMaterial = new THREE.MeshStandardMaterial({ color: 0xd32f2f });
        const chimney = new THREE.Mesh(chimneyGeometry, chimneyMaterial);
        chimney.position.set(0, 9, 7);
        shipGroup.add(chimney);

        scene.add(shipGroup);

        // --- 3. LEDOVÁ VODA / PROSTŘEDÍ ---
        const oceanGeometry = new THREE.PlaneGeometry(300, 300, 32, 32);
        const oceanMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0288d1, 
            roughness: 0.1, 
            wireframe: false 
        });
        const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
        ocean.rotation.x = -Math.PI / 2;
        scene.add(ocean);

        // --- 4. LOGIKA A ANIMACE ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Jemné houpání lodi na ledovém moři
            shipGroup.position.y = Math.sin(time * 1.5) * 0.5;
            shipGroup.rotation.z = Math.sin(time) * 0.05;
            shipGroup.rotation.x = Math.cos(time * 0.8) * 0.03;

            renderer.render(scene, camera);
        }
        animate();

        // --- 5. LOGIKA HLASOVÁNÍ ---
        const votes = { 1: 0, 2: 0, 3: 0 };

        function vote(option) {
            votes[option]++;
            document.getElementById('vote' + option).innerText = votes[option];
        }

        // Úprava velikosti při změně okna
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
