<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Plovoucí Pevnost: Útok zombíků</title>
<style>
  html,body{margin:0;padding:0;background:#061b2b;color:#fff;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;user-select:none;touch-action:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .panel{position:absolute;background:rgba(10,20,30,.78);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 10px;box-shadow:0 0 10px #000;z-index:10;box-sizing:border-box}
  #hud{top:6px;left:6px;right:6px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  #hud b{color:#ffd54a}
  #msg{top:96px;left:6px;right:6px;text-align:center;font-size:14px;display:none;color:#ff8a80}
  #comment{bottom:76px;left:6px;right:6px;font-size:13px}
  #comment .who{color:#80d8ff;font-weight:bold}
  #bar{bottom:6px;left:6px;right:6px;display:flex;gap:6px}
  button{flex:1;background:#2e7d32;color:#fff;border:0;border-radius:10px;padding:10px 4px;font-size:13px;font-weight:bold}
  button.red{background:#c62828}
  button.blue{background:#1565c0}
  button.small{padding:6px 8px;flex:none}
  #over{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="hud">
  <div>📅 Den: <b id="day">1</b> / 15 🧟</div>
  <div>👥 Sledující: <b id="fol">0</b></div>
  <div>🔥 Uhlí: <b id="coal">0</b></div>
  <div>🚪 Dveře: <b id="doors">4/4</b></div>
  <div>🌡️ Teplo: <b id="heat">OK</b></div>
  <div>🧟 Zombíci: <b id="zc">0</b></div>
  <div style="grid-column:1/3;font-size:11px;opacity:.8">Kapacita lodi: <span id="cap">0</span> / 1 000 000 · Ťukni na zombíka = střelba · Tahem otáčíš kameru</div>
</div>

<div class="panel" id="msg"></div>

<div class="panel" id="comment">
  <span class="who" id="cwho"></span>: <span id="ctext">Čekám na komentáře…</span>
  <div style="display:flex;gap:6px;margin-top:6px">
    <button class="small" id="yes">✅ Splnit</button>
    <button class="small red" id="no">❌ Ignorovat</button>
  </div>
</div>

<div class="panel" id="bar">
  <button class="blue" id="video">🎬 Nové video<br>(+sledující)</button>
  <button id="craft">🚪 Vykraftit<br>dveře (20🔥)</button>
  <button class="red" id="viral">🚀 +10 000<br>(test)</button>
</div>

<div id="over"><h1 id="overT"></h1><p id="overP"></p><button style="flex:none;padding:14px 30px" onclick="location.reload()">Hrát znovu</button></div>
