<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plovoucí Pevnost: Útok Zombíků</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .panel {
            position: absolute;
            background: rgba(10, 25, 47, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 10;
            box-sizing: border-box;
            left: 10px;
            right: 10px;
            max-width: 400px;
            margin: 0 auto;
        }
        #velitelsky-panel {
            top: 10px;
        }
        #prani-panel {
            bottom: 10px;
        }
        h2 {
            margin: 0 0 6px 0;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: #cbd5e1;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 4px;
            width: 100%;
            font-size: 0.8rem;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .prani-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

    <div id="canvas-container"></div>

        <div class="stat-row">

        </div>

        </div>

    </div>

              <button class="btn" style="width: auto; padding: 4px 8px; margin: 0;" onclick="schvalit(1)">Schválit ✅</button>

            <div class="prani-box" id="prani-2">

              <button class="btn" style="width: auto; padding: 4px 8px; margin: 0;" onclick="schvalit(2)">Schválit ✅</button>
            </div>
        </div>
    </div>
