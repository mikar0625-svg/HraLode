<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plovoucí Pevnost: Útok Zombíků</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .panel {
            position: absolute;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            box-sizing: border-box;
        }
        #velitelsky-panel {
            top: 15px;
            left: 15px;
            right: 15px;
            max-width: 420px;
            margin: 0 auto;
        }
        #prani-panel {
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-width: 420px;
            margin: 0 auto;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .prani-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Kapitánský můstek -->
    <div id="velitelsky-panel" class="panel">
        <h2>⚓ KAPITÁNSKÝ MŮSTEK <span>(PLOVOUCÍ PEVNOST)</span></h2>
        <div class="stat-row">
            <span>Velitel:</span>
            <strong style="color: #38bdf8;">Ty (Hlavní velitel)</strong>
        </div>
        <div class="stat-row">
            <span>Stav prostředí:</span>
            <strong style="color: #cbd5e1;">Arktický mráz (-25 °C)</strong>
        </div>
        <div class="stat-row">
            <span>Hrozba z moře:</span>
            <strong style="color: #f43f5e;">Útok zombíků za 14 dní! 🧟</strong>
        </div>
        <button class="btn" onclick="zavelit()">Vydat rozkaz velitele</button>
    </div>

    <!-- Panel návrhů od sledujících -->
    <div id="prani-panel" class="panel">
        <h2>💬 NÁVRHY OD SLEDUJÍCÍCH</h2>
        <div id="seznam-prani">
            <div class="prani-box" id="prani-1">
              <span>@SeaExplorer: Vyhřívaný střešní bazén</span>
              <button class="btn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 0.75rem;" onclick="schvalit(1)">Schválit ✅</button>
            </div>
            <div class="prani-box" id="prani-2">
              <span>@CaptainFan: Přidat těžká děla na příď</span>
              <button class="btn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 0.75rem;" onclick="schvalit(2)">Schválit ✅</button>
            </div>
        </div>
    </div>

    <script>
        function zavelit() {
            alert("Rozkaz vydán! Posádka připravuje loď.");
        }
        function schvalit(id) {
            let box = document.getElementById('prani-' + id);
            box.style.background = 'rgba(16, 185, 129, 0.2)';
            box.style.borderColor = 'rgba(16, 185, 129, 0.5)';
            let btn = box.querySelector('button');
            btn.innerText = 'Schváleno! 🏗️';
            btn.style.background = '#10b981';
            btn.disabled = true;
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a192f);
        scene.fog = new THREE.FogExp2(0x0a192f, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(22, 16, 26);
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x38bdf8, 0.4));
        const sunLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
        sunLight.position.set(20, 40, 20);
        scene.add(sunLight);
