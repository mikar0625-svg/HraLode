<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Plovouci Pevnost</title>
<style>
html,body{margin:0;background:#061b2b;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0}
.p{position:absolute;background:rgba(10,20,30,.8);border-radius:10px;padding:6px 8px;z-index:5;box-sizing:border-box;font-size:13px}
#hud{top:5px;left:5px;right:5px}
#msg{top:78px;left:5px;right:5px;text-align:center;color:#ff8a80;display:none}
#com{bottom:62px;left:5px;right:5px}
#bar{bottom:5px;left:5px;right:5px;display:flex;gap:5px}
button{flex:1;background:#2e7d32;color:#fff;border:0;border-radius:8px;padding:9px 3px;font-weight:bold;font-size:12px}
#over{position:fixed;inset:0;background:#000d;display:none;z-index:9;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style></head><body>
<canvas id="c"></canvas>
<div class="p" id="hud">Den <b id="d">1</b>/15 | Sledující <b id="f"></b> | Uhlí <b id="k"></b><br>Dveře <b id="dr"></b> | Zombíci <b id="z">0</b> | <span id="h"></span><br><small>Max loď: 1 000 000 · ťukni na zombíka = střelba</small></div>
<div class="p" id="msg"></div>
<div class="p" id="com"><b id="cw"></b> <span id="ct">Čekám na komentáře…</span><br>
<button id="y" style="width:45%;flex:none">Splnit</button> <button id="n" style="width:45%;flex:none;background:#c62828">Ignorovat</button></div>
<div class="p" id="bar"><button id="v">Nové video</button><button id="cr">Dveře (20 uhlí)</button><button id="t">+10000</button></div>
<div id="over"><h1 id="ot"></h1><button onclick="location.reload()">Hrát znovu</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MAX=1000000,PER=4,ZD=15,DL=10;
const S={f:10,k:40,d:1,t:0,cold:0,over:0,gun:0,z:[],doors:[],pc:null,ct:4};
const $=i=>document.getElementById(i);
const fmt=n=>Math.floor(n).toLocaleString('cs-CZ');
function say(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(say.x);say.x=setTimeout(()=>m.style.display='none',3000)}
function add(n){const b=S.f;S.f=Math.min(MAX,S.f+n);S.k+=(S.f-b)*PER;if(S.f-b<n)say('Loď je plná!')}

const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0a2540);
const cam=new THREE.PerspectiveCamera(60,1,.1,300);
sc.add(new THREE.AmbientLight(0xaaccff,.8));
const L=new THREE.DirectionalLight(0xffffff,.9);L.position.set(20,40,10);sc.add(L);
const M=c=>new THREE.MeshPhongMaterial({color:c});
const sea=new THREE.Mesh(new THREE.PlaneGeometry(400,400,30,30),M(0x0b5a8a));
sea.rotation.x=-Math.PI/2;sc.add(sea);
const sp=sea.geometry.attributes.position,sb=Array.from(sp.array);
const ship=new THREE.Group();sc.add(ship);
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);ship.add(m);return m}
box(10,2,6,0x5d4037,0,.3,0);box(9.6,.2,5.6,0x8d6e63,0,1.4,0);box(3,2,2.5,0x455a64,-1,2.5,0);
const pile=box(1.5,1.5,1.5,0x111111,2.5,2,0);
const fl=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),new THREE.MeshBasicMaterial({color:0xff8a00}));
fl.position.set(-1.5,4,0);ship.add(fl);
box(.6,1.2,.6,0xffd54a,1.2,2.4,1.2);
[[5.1,0,1],[-5.1,0,1],[0,3.1,0],[0,-3.1,0]].forEach(a=>{
const m=box(a[2]?.3:2,2.2,a[2]?2:.3,0xa1887f,a[0],2.5,a[1]);
S.doors.push({m:m,hp:100,x:a[0],z:a[1]})});
function upDoors(){let o=0;S.doors.forEach(d=>{d.m.visible=d.hp>0;if(d.hp>0)o++});$('dr').textContent=o+'/4'}

function spawn(){const a=Math.random()*6.28,r=45+Math.random()*10;
const m=new THREE.Mesh(new THREE.BoxGeometry(.9,1.8,.6),M(0x4caf50));
m.position.set(Math.cos(a)*r,.9,Math.sin(a)*r);sc.add(m);
let b=0,bd=1e9;S.doors.forEach((d,i)=>{const q=Math.hypot(d.x-m.position.x,d.z-m.position.z);if(q<bd){bd=q;b=i}});
S.z.push({m:m,door:b,hp:3})}
function kill(z){sc.remove(z.m);S.z.splice(S.z.indexOf(z),1)}

let A=.8,H=.55,D=22,dg=null;
cv.addEventListener('pointerdown',e=>dg={x:e.clientX,y:e.clientY,mv:0});
cv.addEventListener('pointermove',e=>{if(!dg)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;
if(Math.abs(dx)+Math.abs(dy)>6)dg.mv=1;A-=dx*.008;H=Math.max(.1,Math.min(1.3,H+dy*.004));dg.x=e.clientX;dg.y=e.clientY});
cv.addEventListener('pointerup',e=>{if(dg&&!dg.mv)shoot(e.clientX,e.clientY);dg=null});
const ray=new THREE.Raycaster();
function shoot(x,y){ray.setFromCamera({x:x/innerWidth*2-1,y:-y/innerHeight*2+1},cam);
const h=ray.intersectObjects(S.z.map(z=>z.m));
if(h.length){const z=S.z.find(q=>q.m===h[0].object);if(--z.hp<=0)kill(z)}}

const names=['Honza_CZ','Kuba2010','Lucka','ZombieHunter','Tomas_x','Mimi','ProBoy07'];
function craft(){const b=S.doors.slice().sort((a,c)=>a.hp-c.hp)[0];
if(S.k<20){say('Málo uhlí!');return 0}
if(b.hp>=100){say('Dveře jsou celé.');return 0}
S.k-=20;b.hp=100;upDoors();say('Sledující vykraftili dveře!');return 1}
const C=[
{t:'Dej nám uhlí, je zima! (15)',c:15,o:()=>{S.k-=15;add(100)}},
{t:'Postavte dveře! (20)',c:20,o:()=>{craft()}},
{t:'Chceme kanón! (25)',c:25,o:()=>{S.k-=25;S.gun=25;say('Kanón střílí 25 s')}},
{t:'Pozvu celou třídu, 500 lidí!',c:0,o:()=>add(500)},
{t:'Natoč video s uhlím!',c:0,o:()=>add(40)}];
function newC(){if(S.pc)return;S.pc=C[Math.floor(Math.random()*C.length)];
$('cw').textContent='@'+names[Math.floor(Math.random()*names.length)]+':';$('ct').textContent=S.pc.t}
function clrC(){S.pc=null;$('cw').textContent='';$('ct').textContent='Čekám na komentáře…';S.ct=6}
$('y').onclick=()=>{const c=S.pc;if(!c)return;if(S.k<c.c){say('Málo uhlí!');return}c.o();clrC()};
$('n').onclick=()=>{if(S.pc){S.f=Math.max(0,S.f-Math.ceil(S.f*.01));clrC();say('Ignorováno (-1 %)')}};
$('cr').onclick=craft;
$('v').onclick=()=>{const n=20+Math.floor(Math.random()*60);add(n);say('Video: +'+n+' sledujících')};
$('t').onclick=()=>add(10000);

function end(t){S.over=1;$('over').style.display='flex';$('ot').textContent=t}
function upd(dt){
S.t+=dt;
if(S.t>=DL){S.t=0;S.d++;const need=Math.ceil(S.f*.5);
if(S.k>=need){S.k-=need;S.cold=0}else{S.k=0;S.cold=1;S.f-=Math.ceil(S.f*.1);say('Došlo uhlí! Mrznou sledující')}
add(Math.ceil(S.f*.03)+2);
if(S.d>=ZD){if(S.d==ZD)say('ZOMBÍCI PŘIPLOULI Z MOŘE!');const n=3+(S.d-ZD)*2;for(let i=0;i<n;i++)spawn()}}
S.ct-=dt;if(S.ct<=0&&!S.pc){newC();S.ct=8}
if(S.gun>0){S.gun-=dt;S.gt=(S.gt||0)-dt;if(S.gt<=0&&S.z.length){S.gt=.7;if(--S.z[0].hp<=0)kill(S.z[0])}}
S.z.slice().forEach(z=>{const d=S.doors[z.door],dx=d.x-z.m.position.x,dz=d.z-z.m.position.z,q=Math.hypot(dx,dz);
if(q>1.6){z.m.position.x+=dx/q*2.2*dt;z.m.position.z+=dz/q*2.2*dt}
else if(d.hp>0){d.hp-=12*dt;if(d.hp<=0){d.hp=0;upDoors();say('Zombíci rozbili dveře! Vykraft nové!')}}
else S.f=Math.max(0,S.f-Math.ceil(S.f*.02*dt)-dt)});
if(S.f<=0){S.f=0;end('Loď padla – den '+S.d)}
if(S.d>=ZD+10&&!S.z.length)end('Vyhrál jsi! '+fmt(S.f)+' sledujících')}

let last=performance.now(),tm=0;
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;tm+=dt;
if(!S.over)upd(dt);
for(let i=0;i<sp.count;i++)sp.setZ(i,sb[i*3+2]+Math.sin(tm*1.5+sb[i*3]*.2+sb[i*3+1]*.2)*.4);
sp.needsUpdate=true;ship.position.y=Math.sin(tm*1.2)*.15;
fl.scale.setScalar(S.cold?.2:.8+Math.sin(tm*12)*.25);
pile.scale.setScalar(.5+Math.min(1.5,S.k/400));
$('d').textContent=S.d;$('f').textContent=fmt(S.f);$('k').textContent=fmt(S.k);
$('z').textContent=S.z.length;$('h').textContent=S.cold?'ZIMA':'Teplo OK';
cam.position.set(Math.cos(A)*D,6+H*D*.6,Math.sin(A)*D);cam.lookAt(0,2,0);
R.render(sc,cam)}
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();upDoors();requestAnimationFrame(loop);
</script></body></html>
