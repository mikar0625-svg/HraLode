<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HraLode - Velký Plovoucí Hotel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1d3a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .panel {
            position: absolute;
            background: rgba(11, 29, 58, 0.9);
            border: 2px solid #1e3c72;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
        }
        #velitelsky-panel {
            top: 15px;
            left: 15px;
            right: 15px;
            max-width: 420px;
        }
        #prani-panel {
            bottom: 15px;
            left: 15px;
            right: 15px;
            max-width: 420px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #4facfe;
            text-transform: uppercase;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            width: 100%;
        }
        .btn:hover {
            background: linear-gradient(135deg, #2a5298 100%, #4facfe 100%);
        }
        .prani-box {
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Velitelský panel -->
    <div id="velitelsky-panel" class="panel">
        <h2>⚓ Kapitánský Můstek (Plovoucí Hotel)</h2>
        <div class="stat-row">
            <span>Velitel:</span>
            <strong style="color: #38bdf8;">Ty (Hlavní velitel)</strong>
        </div>
        <div class="stat-row">
            <span>Stav zimy:</span>
            <strong style="color: #f43f5e;">Extrémní mráz (-25 °C)</strong>
        </div>
        <div class="stat-row">
            <span>Vodní zombíci:</span>
            <strong style="color: #f43f5e;">Útok za 14 dní! 🧟</strong>
        </div>
        <button class="btn" onclick="zavelit()">Vydat rozkaz velitele</button>
    </div>

    <!-- Panel přání od sledujících -->
    <div id="prani-panel" class="panel">
        <h2>💬 Návrhy od Sledujících</h2>
        <div id="seznam-prani">
            <div class="prani-box" id="prani-1">
              <span>@pepa: Postavit bazén na palubě</span>
              <button class="btn" style="width: auto; padding: 4px 10px; font-size: 0.8rem;" onclick="schvalit(1)">Schválit ✅</button>
            </div>
            <div class="prani-box" id="prani-2">
              <span>@jana: Přidat obranné věže</span>
              <button class="btn" style="width: auto; padding: 4px 10px; font-size: 0.8rem;" onclick="schvalit(2)">Schválit ✅</button>
            </div>
        </div>
    </div>

    <script>
        function zavelit() {
            alert("Rozkaz vydán, veliteli!");
        }
        function schvalit(id) {
            let box = document.getElementById('prani-' + id);
            box.style.background = 'rgba(16, 185, 129, 0.2)';
            box.querySelector('button').innerText = 'Schváleno! 🏗️';
            box.querySelector('button').disabled = true;
        }

        camera.lookAt(0, 2, 0);

        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(15, 30, 20);
        scene.add(dirLight);
